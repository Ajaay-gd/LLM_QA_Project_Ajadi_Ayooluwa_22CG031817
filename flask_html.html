<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Q&A Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .card-content {
            color: #333;
            line-height: 1.6;
        }

        .tokens {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .token {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .badge {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 LLM Q&A Application</h1>
            <p>Ask any question and get instant AI-powered answers</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="questionInput" 
                        placeholder="Enter your question here..."
                        autocomplete="off"
                    >
                    <button id="askButton" onclick="askQuestion()">Ask Question</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your question...</p>
            </div>

            <div id="errorMessage"></div>

            <div class="result-section" id="resultSection">
                <div class="card">
                    <h3>📝 Your Question</h3>
                    <div class="card-content" id="originalQuestion"></div>
                </div>

                <div class="card">
                    <h3>🔍 Processed Question</h3>
                    <div class="card-content" id="processedQuestion"></div>
                    <div style="margin-top: 15px;">
                        <span class="badge" id="tokenCount">0 tokens</span>
                    </div>
                </div>

                <div class="card">
                    <h3>📊 Tokens</h3>
                    <div class="tokens" id="tokensDisplay"></div>
                </div>

                <div class="card">
                    <h3>✨ Answer</h3>
                    <div class="card-content" id="answer"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            Built with Flask | Powered by Groq API
        </div>
    </div>

    <script>
        // Allow Enter key to submit
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });

        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            
            if (!question) {
                showError('Please enter a question.');
                return;
            }

            // Show loading, hide results
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('errorMessage').innerHTML = '';
            document.getElementById('askButton').disabled = true;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data);
                } else {
                    showError(data.error || 'An error occurred. Please try again.');
                }
            } catch (error) {
                showError('Failed to connect to the server. Please try again.');
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('askButton').disabled = false;
            }
        }

        function displayResult(data) {
            document.getElementById('originalQuestion').textContent = data.original_question;
            document.getElementById('processedQuestion').textContent = data.processed_question;
            document.getElementById('tokenCount').textContent = `${data.token_count} tokens`;
            document.getElementById('answer').textContent = data.answer;

            // Display tokens
            const tokensDisplay = document.getElementById('tokensDisplay');
            tokensDisplay.innerHTML = '';
            data.tokens.forEach(token => {
                const span = document.createElement('span');
                span.className = 'token';
                span.textContent = token;
                tokensDisplay.appendChild(span);
            });

            document.getElementById('resultSection').classList.add('show');
        }

        function showError(message) {
            document.getElementById('errorMessage').innerHTML = 
                `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
